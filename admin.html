<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AXY OFFICIAL | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</head>
<body class="admin-page" data-page="admin">
  <header class="site-header">
    <nav class="container nav">
      <a class="brand" href="index.html">
        <span class="brand-mark">A</span>
        <span>AXY <b>OFFICIAL</b></span>
      </a>
      <a class="back-home" href="index.html">← Back to website</a>
    </nav>
  </header>

  <main class="admin-main">
    <div class="admin-decoration admin-decoration-one"></div>
    <div class="admin-decoration admin-decoration-two"></div>

    <section class="container admin-shell">
      <div class="admin-intro">
        <p class="eyebrow">Private area</p>
        <h1>AXY Admin<br><span>Dashboard.</span></h1>
        <p>Sign in to publish updates to the AXY OFFICIAL website.</p>
        <a class="admin-back-link" href="index.html">← Return to public site</a>
      </div>

      <div class="admin-panel">
        <form id="loginForm" class="admin-form">
          <div>
            <p class="eyebrow dark-eyebrow">Admin sign in</p>
            <h2>Welcome back.</h2>
          </div>

          <label>
            Username
            <input id="adminUsername" type="text" autocomplete="username" required>
          </label>

          <label>
            Password
            <input id="adminPassword" type="password" autocomplete="current-password" required>
          </label>

          <button class="button button-dark" type="submit">Log in <span>→</span></button>
          <p id="loginMessage" class="form-message" role="status"></p>
        </form>

        <div id="publisher" hidden>
          <div class="dashboard-heading">
            <div>
              <p class="eyebrow dark-eyebrow">Content manager</p>
              <h2>Publish an update</h2>
            </div>
            <button class="button button-light" id="logoutButton" type="button">Log out</button>
          </div>

          <form id="updateForm" class="admin-form">
            <label>
              Update title
              <input id="updateTitle" type="text" maxlength="100" placeholder="Offer or announcement title" required>
            </label>

            <label>
              Update details
              <textarea id="updateBody" rows="5" maxlength="3000" placeholder="Write the update details…" required></textarea>
            </label>

            <label>
              Image (optional, max 5 MB)
              <input id="updateImage" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
            </label>

            <div class="form-two-columns">
              <label>
                Button text (optional)
                <input id="updateButtonText" type="text" maxlength="40" placeholder="Open offer">
              </label>
              <label>
                Button link (optional)
                <input id="updateButtonUrl" type="url" placeholder="https://example.com">
              </label>
            </div>

            <button class="button button-dark" type="submit">Publish update <span>↗</span></button>
            <p id="publishMessage" class="form-message" role="status"></p>
          </form>

          <div class="dashboard-divider"></div>
          <h3 class="admin-list-title">Published updates</h3>
          <div id="adminUpdatesList" class="updates-list"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
